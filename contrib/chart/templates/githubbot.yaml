{{- if .Values.githubbot.enabled }}
{{- if ne (int .Values.githubbot.replicaCount) 1 }}
{{- fail "githubbot.replicaCount must be 1; per-PR controllers are process-serialized (scale sandbox runners for concurrent work)" }}
{{- end }}
{{- $apiRsName := include "centaur.componentName" (dict "root" . "component" "api-rs") -}}
{{- if or .Values.githubbot.reviewPrompt .Values.githubbot.issuePrompt .Values.githubbot.managementPrompt }}
# Optional review / issue-work methodology overrides, delivered as mounted files
# the bot reads at boot via GITHUBBOT_REVIEW_PROMPT_FILE / _ISSUE_PROMPT_FILE.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "centaur.componentName" (dict "root" . "component" "githubbot") }}-prompts
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "githubbot") | nindent 4 }}
data:
{{- if .Values.githubbot.reviewPrompt }}
  review-prompt.md: |-
{{- .Values.githubbot.reviewPrompt | nindent 4 }}
{{- end }}
{{- if .Values.githubbot.issuePrompt }}
  issue-prompt.md: |-
{{- .Values.githubbot.issuePrompt | nindent 4 }}
{{- end }}
{{- if .Values.githubbot.managementPrompt }}
  management-prompt.md: |-
{{- .Values.githubbot.managementPrompt | nindent 4 }}
{{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "centaur.componentName" (dict "root" . "component" "githubbot") }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "githubbot") | nindent 4 }}
spec:
  replicas: {{ .Values.githubbot.replicaCount }}
  selector:
    matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "githubbot") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/infra-secrets: {{ include "centaur.infraSecretsChecksum" . }}
        checksum/github-app-private-key: {{ include "centaur.githubbotAppChecksum" . }}
{{- if or .Values.githubbot.reviewPrompt .Values.githubbot.issuePrompt .Values.githubbot.managementPrompt }}
        checksum/prompts: {{ dict "review" .Values.githubbot.reviewPrompt "issue" .Values.githubbot.issuePrompt "management" .Values.githubbot.managementPrompt | toJson | sha256sum }}
{{- end }}
      labels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "githubbot") | nindent 8 }}
    spec:
      # Give in-flight agent turns time to finish on a rollout; the bot drains
      # background work for GITHUBBOT_SHUTDOWN_DRAIN_MS (set below from this) on
      # SIGTERM so a deploy doesn't drop a running CI fix / review / issue turn.
      terminationGracePeriodSeconds: {{ .Values.githubbot.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: githubbot
          image: {{ printf "%s:%s" .Values.githubbot.image.repository .Values.githubbot.image.tag | quote }}
          imagePullPolicy: {{ .Values.githubbot.image.pullPolicy }}
          env:
            - name: PORT
              value: "3001"
            - name: CENTAUR_API_URL
              value: {{ printf "http://%s:%v" $apiRsName .Values.apiRs.port | quote }}
            # New threads without an explicit --claude/--amp/--codex flag run
            # the deployment's default harness.
            - name: GITHUBBOT_DEFAULT_HARNESS
              value: {{ .Values.sandbox.harnessEngine | quote }}
{{- if .Values.githubbot.githubApp.enabled }}
            - name: GITHUB_APP_CLIENT_ID
              value: {{ required "githubbot.githubApp.clientId is required when GitHub App authentication is enabled" .Values.githubbot.githubApp.clientId | quote }}
            - name: GITHUB_INSTALLATION_ID
              value: {{ required "githubbot.githubApp.installationId is required when GitHub App authentication is enabled" .Values.githubbot.githubApp.installationId | quote }}
            - name: GITHUB_PRIVATE_KEY_FILE
              value: {{ printf "%s/%s" (required "githubbot.githubApp.privateKeyMountPath is required when GitHub App authentication is enabled" .Values.githubbot.githubApp.privateKeyMountPath) (required "githubbot.githubApp.privateKeySecretKey is required when GitHub App authentication is enabled" .Values.githubbot.githubApp.privateKeySecretKey) | quote }}
{{- else }}
            # Personal access token for the bot's GitHub teammate account. This
            # compatibility mode remains available for deployments without an App.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "centaur.secretEnvName" . }}
                  key: {{ printf "%sGITHUBBOT_TOKEN" .Values.secretManager.envPrefix }}
{{- end }}
            # githubbot's own webhook signing secret (the GitHub repo/org webhook).
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "centaur.secretEnvName" . }}
                  key: {{ printf "%sGITHUBBOT_WEBHOOK_SECRET" .Values.secretManager.envPrefix }}
            - name: GITHUBBOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "centaur.secretEnvName" . }}
                  key: {{ printf "%sGITHUBBOT_API_KEY" .Values.secretManager.envPrefix }}
            - name: GITHUBBOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "centaur.secretEnvName" . }}
                  key: {{ printf "%sDATABASE_URL" .Values.secretManager.envPrefix }}
            - name: GITHUB_BOT_USERNAME
              value: {{ required "githubbot.userName is required (App mention slug or PAT account login)" .Values.githubbot.userName | quote }}
{{- if .Values.githubbot.botActorLogin }}
            - name: GITHUB_BOT_ACTOR_LOGIN
              value: {{ .Values.githubbot.botActorLogin | quote }}
{{- end }}
            - name: GITHUBBOT_REPOSITORY_ALLOWLIST
              value: {{ required "githubbot.repositoryAllowlist is required when githubbot is enabled" .Values.githubbot.repositoryAllowlist | quote }}
            # v2 PR self-management knobs.
            - name: GITHUBBOT_AUTO_MERGE
              value: {{ .Values.githubbot.autoMerge | quote }}
            - name: GITHUBBOT_MERGE_METHOD
              value: {{ .Values.githubbot.mergeMethod | quote }}
            - name: GITHUBBOT_OWNERSHIP_LABEL
              value: {{ required "githubbot.ownershipLabel is required when githubbot is enabled" .Values.githubbot.ownershipLabel | quote }}
            - name: GITHUBBOT_REVIEW_MAX_ROUNDS_PER_EPOCH
              value: {{ .Values.githubbot.reviewMaxRoundsPerEpoch | quote }}
            - name: GITHUBBOT_REVIEW_MAX_TOTAL_ROUNDS_PER_EPOCH
              value: {{ .Values.githubbot.reviewMaxTotalRoundsPerEpoch | quote }}
            - name: GITHUBBOT_REVIEW_MAX_EPOCHS
              value: {{ .Values.githubbot.reviewMaxEpochs | quote }}
            - name: GITHUBBOT_REVIEW_MATERIAL_CHANGE_LINES
              value: {{ .Values.githubbot.reviewMaterialChangeLines | quote }}
            - name: GITHUBBOT_REVIEW_MATERIAL_CHANGE_FILES
              value: {{ .Values.githubbot.reviewMaterialChangeFiles | quote }}
{{- if .Values.githubbot.reviewAuthorAllowlist }}
            - name: GITHUBBOT_REVIEW_AUTHOR_ALLOWLIST
              value: {{ .Values.githubbot.reviewAuthorAllowlist | quote }}
{{- end }}
            - name: GITHUBBOT_REVIEW_RESET_LABEL
              value: {{ .Values.githubbot.reviewResetLabel | quote }}
            - name: GITHUBBOT_WORKFLOW_EVENTS
              value: {{ .Values.githubbot.workflowEvents | quote }}
{{- if .Values.githubbot.escalationHandle }}
            - name: GITHUBBOT_ESCALATION_HANDLE
              value: {{ .Values.githubbot.escalationHandle | quote }}
{{- end }}
{{- if .Values.githubbot.reviewPrompt }}
            - name: GITHUBBOT_REVIEW_PROMPT_FILE
              value: /etc/githubbot/prompts/review-prompt.md
{{- end }}
{{- if .Values.githubbot.issuePrompt }}
            - name: GITHUBBOT_ISSUE_PROMPT_FILE
              value: /etc/githubbot/prompts/issue-prompt.md
{{- end }}
{{- if .Values.githubbot.managementPrompt }}
            - name: GITHUBBOT_MANAGEMENT_PROMPT_FILE
              value: /etc/githubbot/prompts/management-prompt.md
{{- end }}
{{- if .Values.githubbot.allowedAuthorAssociations }}
            # author_association allowlist for the comment-mention path; unset =
            # the bot's safe default (OWNER, MEMBER, COLLABORATOR).
            - name: GITHUBBOT_ALLOWED_AUTHOR_ASSOCIATIONS
              value: {{ .Values.githubbot.allowedAuthorAssociations | quote }}
{{- end }}
            # Drain budget on shutdown — kept ~10s under the grace period so the
            # final flush + exit still fit before the pod is force-killed.
            - name: GITHUBBOT_SHUTDOWN_DRAIN_MS
              value: {{ mul (sub (int .Values.githubbot.terminationGracePeriodSeconds) 10) 1000 | quote }}
{{- if .Values.codex.customProviders }}
            - name: CODEX_CUSTOM_PROVIDERS
              value: {{ .Values.codex.customProviders | toJson | quote }}
{{- end }}
{{- range $name, $value := .Values.githubbot.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
{{- end }}
          ports:
            - containerPort: 3001
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            timeoutSeconds: 5
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
{{ toYaml .Values.githubbot.resources | nindent 12 }}
{{- if or .Values.githubbot.githubApp.enabled .Values.githubbot.reviewPrompt .Values.githubbot.issuePrompt .Values.githubbot.managementPrompt }}
          volumeMounts:
{{- if .Values.githubbot.githubApp.enabled }}
            - name: github-app-private-key
              mountPath: {{ required "githubbot.githubApp.privateKeyMountPath is required when GitHub App authentication is enabled" .Values.githubbot.githubApp.privateKeyMountPath | quote }}
              readOnly: true
{{- end }}
{{- if or .Values.githubbot.reviewPrompt .Values.githubbot.issuePrompt .Values.githubbot.managementPrompt }}
            - name: prompts
              mountPath: /etc/githubbot/prompts
              readOnly: true
{{- end }}
      volumes:
{{- if .Values.githubbot.githubApp.enabled }}
        - name: github-app-private-key
          secret:
            secretName: {{ required "githubbot.githubApp.existingSecretName is required when GitHub App authentication is enabled" .Values.githubbot.githubApp.existingSecretName | quote }}
            items:
              - key: {{ required "githubbot.githubApp.privateKeySecretKey is required when GitHub App authentication is enabled" .Values.githubbot.githubApp.privateKeySecretKey | quote }}
                path: {{ required "githubbot.githubApp.privateKeySecretKey is required when GitHub App authentication is enabled" .Values.githubbot.githubApp.privateKeySecretKey | quote }}
{{- end }}
{{- if or .Values.githubbot.reviewPrompt .Values.githubbot.issuePrompt .Values.githubbot.managementPrompt }}
        - name: prompts
          configMap:
            name: {{ include "centaur.componentName" (dict "root" . "component" "githubbot") }}-prompts
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "centaur.componentName" (dict "root" . "component" "githubbot") }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "githubbot") | nindent 4 }}
spec:
  selector:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "githubbot") | nindent 4 }}
  ports:
    - name: http
      port: 3001
      targetPort: 3001
{{- end }}
