[project]
name = "centaur_investigator"
description = "Diagnose Centaur workflow runs and sessions with sanitized read-only state"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
centaur-investigator = "centaur_tool_centaur_investigator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_centaur_investigator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
hosts = []

[[tool.centaur.secrets]]
type = "pg_dsn"
name = "centaur_diagnostics_dsn"
database = "ai_v2"
secret_ref = "CENTAUR_POSTGRES_DSN"
role = "centaur_readonly"
